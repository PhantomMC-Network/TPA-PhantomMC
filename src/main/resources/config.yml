database:

  # SQLite file inside plugins/TPAPlugin/
  file: database.db

settings:

  # How long a TPA request stays active
  request-expire-seconds: 60

  # Teleport warmup time
  teleport-warmup-seconds: 5

  # Cooldown between TPA requests
  cooldown-seconds: 30

  # Cancel teleport when player moves
  cancel-on-move: true

  # Cancel teleport when player takes damage
  cancel-on-damage: true


messages:

  prefix: "&8[&bTPA&8] "

  request-sent: "&aYou sent a TPA request to &f%player%&a."
  request-received: "&e%player% &fwants to teleport to you."

  request-accepted-sender: "&aYour TPA request to &e%player% &ahas been accepted."
  request-accepted: "&aYou accepted the TPA request from &e%player%&a."

  request-denied: "&cYou denied &f%player%&c's TPA request."
  request-denied-sender: "&cYour TPA request to &e%player% &chas been denied."
  request-expired: "&cThis TPA request has expired."
  request-expired-sender: "&cYour TPA request to &e%player% &chas expired."
  request-expired-target: "&cThe TPA request from &e%player% &chas expired."

  request-cancelled: "&cYour TPA request has been cancelled."
  request-cancelled-target: "&c%player% &chas cancelled their TPA request."
  request-already-exists: "&cThis player already has a pending TPA request."

  request-sender-offline: "&cThe player who sent the request is offline."

  teleport-started: "&eTeleporting in &f%seconds% &eseconds..."
  teleport-success: "&aTeleporting..."
  teleport-cancelled: "&cTeleport cancelled because you moved."
  teleport-cancelled-damage: "&cTeleport cancelled because you took damage."

  tpa-disabled: "&cThis player has TPA disabled."
  tpa-enabled: "&aTPA requests are now enabled."
  tpa-disabled-self: "&cTPA requests are now disabled."

  player-not-found: "&cPlayer &f%player% &cwas not found."
  cannot-target-self: "&cYou cannot send a TPA request to yourself."

  no-pending-request: "&cYou don't have any pending TPA request."
  no-request-to-cancel: "&cYou don't have any TPA request to cancel."

  cooldown: "&cYou must wait &f%seconds% &cseconds before sending another TPA request."

  no-permission: "&cYou don't have permission to use this command."

  teleport-actionbar: "&8✦ &bTeleporting in &f%seconds%s &8✦"
  teleport-actionbar-success: "&8✦ &aTeleported successfully! &8✦"